name: Backend CI

on:
  push:
    branches:
      - main
      - development/architecture-alignment
      - 'feat/**'
      - feat/organization-identity-rbac
      - development/architecture-alignment
      - feat/global-administrator-role-migration
  pull_request:
    branches:
      - main
      - development/architecture-alignment

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assetpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assetpass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assetpass_test
      JWT_ACCESS_SECRET: ci-only-secret-for-auth-regression-validation-that-is-at-least-64-characters-long
      JWT_ACCESS_ISSUER: assetpass-api
      JWT_ACCESS_AUDIENCE: assetpass-app
      APP_ORIGIN: http://localhost:3000
      DB_SSL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build backend
        run: npm run build
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Ensure PostgreSQL driver is available to E2E runtime
        run: npm install pg@8.23.1 --no-save --no-audit --no-fund && node -e "require.resolve('pg')"
      - name: Run end-to-end regression tests
        run: npm run test:e2e

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assetpass_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assetpass_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assetpass_ci
      JWT_ACCESS_SECRET: ci-only-secret-for-migration-validation-that-is-at-least-64-characters-long
      JWT_ACCESS_ISSUER: assetpass-api
      JWT_ACCESS_AUDIENCE: assetpass-app
      APP_ORIGIN: http://localhost:3000
      DB_SSL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Show pending migrations
        run: npm run migration:show
      - name: Apply all migrations
        run: npm run migration:run
      - name: Verify applied migrations
        run: npm run migration:show
      - name: Verify membership history database guards
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          CREATE TEMP TABLE membership_event_guard_probe (id integer) ON COMMIT DROP;
          CREATE TRIGGER membership_event_guard_probe_trigger
          BEFORE UPDATE OR DELETE ON membership_event_guard_probe
          FOR EACH ROW EXECUTE FUNCTION reject_organization_membership_event_mutation();
          INSERT INTO membership_event_guard_probe (id) VALUES (1);

          DO $event_guard$
          BEGIN
            BEGIN
              UPDATE membership_event_guard_probe SET id = 2 WHERE id = 1;
              RAISE EXCEPTION 'Expected membership event UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            BEGIN
              DELETE FROM membership_event_guard_probe WHERE id = 1;
              RAISE EXCEPTION 'Expected membership event DELETE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $event_guard$;

          CREATE TEMP TABLE role_assignment_guard_probe (
            id integer PRIMARY KEY,
            membership_id uuid,
            role_id uuid,
            assigned_by_user_id uuid,
            assigned_at timestamptz,
            revoked_at timestamptz,
            revoked_by_user_id uuid,
            revocation_reason text
          ) ON COMMIT DROP;
          CREATE TRIGGER role_assignment_guard_probe_trigger
          BEFORE UPDATE OR DELETE ON role_assignment_guard_probe
          FOR EACH ROW EXECUTE FUNCTION guard_organization_membership_role_history();
          INSERT INTO role_assignment_guard_probe (
            id, membership_id, role_id, assigned_by_user_id, assigned_at
          ) VALUES (
            1,
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            '33333333-3333-4333-8333-333333333333',
            now()
          );

          DO $role_guard$
          BEGIN
            BEGIN
              UPDATE role_assignment_guard_probe
              SET role_id = '44444444-4444-4444-8444-444444444444'
              WHERE id = 1;
              RAISE EXCEPTION 'Expected role assignment identity UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            BEGIN
              DELETE FROM role_assignment_guard_probe WHERE id = 1;
              RAISE EXCEPTION 'Expected role assignment DELETE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $role_guard$;

          UPDATE role_assignment_guard_probe
          SET revoked_at = now(),
              revoked_by_user_id = '33333333-3333-4333-8333-333333333333',
              revocation_reason = 'CI test revocation'
          WHERE id = 1;

          DO $role_revoke_guard$
          BEGIN
            BEGIN
              UPDATE role_assignment_guard_probe
              SET revocation_reason = 'attempted history rewrite'
              WHERE id = 1;
              RAISE EXCEPTION 'Expected a second role assignment revocation UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $role_revoke_guard$;

          ROLLBACK;
          SQL
      - name: Verify application entitlement and representation database guards
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          CREATE TEMP TABLE entitlement_guard_probe (
            id uuid,
            user_id uuid,
            organization_id uuid,
            application_key text,
            granted_at timestamptz,
            granted_by_user_id uuid,
            grant_source text,
            revoked_at timestamptz,
            revoked_by_user_id uuid,
            revocation_reason text,
            created_at timestamptz
          ) ON COMMIT DROP;
          CREATE TRIGGER entitlement_guard_probe_trigger
          BEFORE UPDATE OR DELETE ON entitlement_guard_probe
          FOR EACH ROW EXECUTE FUNCTION guard_application_entitlement_history();
          INSERT INTO entitlement_guard_probe (
            id, user_id, application_key, granted_at, grant_source, created_at
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'marketplace',
            now(),
            'ci_probe',
            now()
          );

          DO $entitlement_guard$
          BEGIN
            BEGIN
              UPDATE entitlement_guard_probe
              SET grant_source = 'rewritten'
              WHERE id = '11111111-1111-4111-8111-111111111111';
              RAISE EXCEPTION 'Expected entitlement grant identity UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            BEGIN
              DELETE FROM entitlement_guard_probe
              WHERE id = '11111111-1111-4111-8111-111111111111';
              RAISE EXCEPTION 'Expected entitlement DELETE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $entitlement_guard$;

          UPDATE entitlement_guard_probe
          SET revoked_at = now(), revocation_reason = 'CI test revocation'
          WHERE id = '11111111-1111-4111-8111-111111111111';

          DO $entitlement_revoke_guard$
          BEGIN
            BEGIN
              UPDATE entitlement_guard_probe
              SET revocation_reason = 'attempted history rewrite'
              WHERE id = '11111111-1111-4111-8111-111111111111';
              RAISE EXCEPTION 'Expected a second entitlement revocation UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $entitlement_revoke_guard$;

          CREATE TEMP TABLE representation_guard_probe (
            id uuid,
            organization_id uuid,
            user_id uuid,
            membership_id uuid,
            granted_by_user_id uuid,
            granted_by_membership_id uuid,
            authority_basis text,
            authority_reference text,
            effective_at timestamptz,
            expires_at timestamptz,
            revoked_at timestamptz,
            revoked_by_user_id uuid,
            revocation_reason text,
            created_at timestamptz
          ) ON COMMIT DROP;
          CREATE TRIGGER representation_guard_probe_trigger
          BEFORE UPDATE OR DELETE ON representation_guard_probe
          FOR EACH ROW EXECUTE FUNCTION guard_organization_marketplace_representative_history();
          INSERT INTO representation_guard_probe (
            id, organization_id, user_id, membership_id, granted_by_user_id,
            granted_by_membership_id, authority_basis, effective_at, created_at
          ) VALUES (
            '33333333-3333-4333-8333-333333333333',
            '44444444-4444-4444-8444-444444444444',
            '55555555-5555-4555-8555-555555555555',
            '66666666-6666-4666-8666-666666666666',
            '77777777-7777-4777-8777-777777777777',
            '88888888-8888-4888-8888-888888888888',
            'organization_owner_approval',
            now(),
            now()
          );

          DO $representation_guard$
          BEGIN
            BEGIN
              UPDATE representation_guard_probe
              SET authority_basis = 'rewritten'
              WHERE id = '33333333-3333-4333-8333-333333333333';
              RAISE EXCEPTION 'Expected representation grant identity UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            BEGIN
              DELETE FROM representation_guard_probe
              WHERE id = '33333333-3333-4333-8333-333333333333';
              RAISE EXCEPTION 'Expected representation grant DELETE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $representation_guard$;

          UPDATE representation_guard_probe
          SET revoked_at = now(), revocation_reason = 'CI test revocation'
          WHERE id = '33333333-3333-4333-8333-333333333333';

          DO $representation_revoke_guard$
          BEGIN
            BEGIN
              UPDATE representation_guard_probe
              SET revocation_reason = 'attempted history rewrite'
              WHERE id = '33333333-3333-4333-8333-333333333333';
              RAISE EXCEPTION 'Expected a second representation revocation UPDATE to be rejected.';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END;
          $representation_revoke_guard$;

          ROLLBACK;
          SQL
      - name: Roll back new-user approval default migration
        run: npm run migration:revert
      - name: Roll back application entitlement migration
        run: npm run migration:revert
      - name: Roll back organization membership history migration
        run: npm run migration:revert
      - name: Roll back password recovery foundation migration
        run: npm run migration:revert
      - name: Roll back Global Administrator role migration
        run: npm run migration:revert
      - name: Roll back organisation onboarding session migration
        run: npm run migration:revert
      - name: Roll back organisation-first onboarding migration
        run: npm run migration:revert
      - name: Reapply all migrations after rollback
        run: npm run migration:run
      - name: Confirm migration state after rollback and reapply
        run: npm run migration:show
